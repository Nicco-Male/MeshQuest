[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "meshquest"
version = "0.4.0a0"
description = "An open-source radio-route exploration game built on Meshtastic."
readme = "README.md"
requires-python = ">=3.11"
license = {text = "MIT"}
authors = [{name = "MeshQuest contributors"}]
dependencies = ["fastapi>=0.110,<1", "uvicorn>=0.30,<1", "sqlalchemy>=2.0,<3"]

[project.optional-dependencies]
postgres = ["psycopg[binary]>=3.2,<4"]
test = ["pytest>=8,<10", "httpx>=0.27,<1"]

[tool.setuptools.packages.find]
include = ["meshquest*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
