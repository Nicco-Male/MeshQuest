name: MQTT Core Transport
on:
  push:
    paths:
      - 'meshquest/transports/**'
      - 'tests/test_mqtt_transport.py'
      - 'pyproject.toml'
      - 'Dockerfile.mqtt'
      - '.github/workflows/mqtt-transport.yml'
  pull_request:
    paths:
      - 'meshquest/transports/**'
      - 'tests/test_mqtt_transport.py'
      - 'pyproject.toml'
      - 'Dockerfile.mqtt'
      - '.github/workflows/mqtt-transport.yml'
permissions:
  contents: read
jobs:
  mqtt:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install '.[test,mqtt]'
      - run: python -m pytest -q tests/test_mqtt_transport.py
      - run: python -m meshquest.transports.mqtt --help
